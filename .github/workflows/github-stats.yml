name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "profile/*.svg"

  workflow_dispatch:

concurrency:
  group: github-profile-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-profile-stats:
    name: Generate Profile Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # -------------------------
      # GitHub Statistics
      # -------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&
            show_icons=true&
            theme=dark&
            hide_border=true&
            include_all_commits=false&
            count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      # -------------------------
      # Projects by Primary Language
      # -------------------------
      - name: Generate Project Language Statistics
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/generate_project_languages.py

          echo "Checking generated file..."
          test -s profile/projects-by-language.svg

          echo "Generated successfully:"
          ls -lh profile/projects-by-language.svg

      # -------------------------
      # GitHub Streak
      # -------------------------
      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: >-
            user=${{ github.repository_owner }}&
            theme=dark&
            hide_border=true&
            disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # -------------------------
      # Commit Changes
      # -------------------------
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/streak.svg
          git add profile/projects-by-language.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile statistics"
          git push
