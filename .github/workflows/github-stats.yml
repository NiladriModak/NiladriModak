name: Update GitHub Profile Stats

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

  # Allows you to run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------
      # Checkout profile repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------
      # Generate GitHub Stats
      # -----------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=NiladriModak&show_icons=true&theme=dark&hide_border=false&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      # -----------------------------------------
      # Generate Top Languages
      # -----------------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=NiladriModak&layout=compact&langs_count=8&theme=dark&hide_border=false&count_private=true
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      # -----------------------------------------
      # Generate GitHub Streak
      # -----------------------------------------
      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=NiladriModak&theme=dark&hide_border=false&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # -----------------------------------------
      # Commit generated SVG files
      # -----------------------------------------
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
